<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feu vert, feu jaune, feu rouge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : une colonne calme ; le graphique des centiles est la pièce centrale,
   les feux de circulation donnent la couleur (vert, jaune, rouge), le reste reste neutre. */
:root {
  --bg: #f1f3f2;
  --surface: #ffffff;
  --surface-2: #f7f8f7;
  --ink: #1a1f24;
  --muted: #5a636c;
  --line: #dde1df;
  --grid: #e9ecea;
  --accent: #27477a;
  --housing: #1f2429;

  --go: #1f8a57;      --go-ink: #13683f;   --go-soft: #e2f1e8;
  --wait: #d09412;    --wait-ink: #845800; --wait-soft: #fbefd5;
  --stop: #c63f30;    --stop-ink: #a12d1f; --stop-soft: #f8e2de;
  --on-signal: #ffffff;
  --shadow: 0 1px 2px rgb(20 30 30 / 0.06), 0 6px 24px rgb(20 30 30 / 0.06);

  --cjk: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB";
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, var(--cjk), sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, var(--cjk), sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, var(--cjk), monospace;
}
/* Glyphes japonais plutôt que chinois quand la page est en japonais. */
:root:lang(ja) { --cjk: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP"; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111417; --surface: #191d21; --surface-2: #1f2428; --ink: #e7eaec; --muted: #9ba4ac;
    --line: #2c3237; --grid: #242a2f; --accent: #93b4ec; --housing: #0b0d0f;
    --go: #3cbd7d;   --go-ink: #6fd9a2;   --go-soft: #16291f;
    --wait: #e5b23c; --wait-ink: #f1c867; --wait-soft: #2e2511;
    --stop: #ec6a58; --stop-ink: #ff9585; --stop-soft: #351b18;
    --on-signal: #0c1210;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 28px rgb(0 0 0 / 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111417; --surface: #191d21; --surface-2: #1f2428; --ink: #e7eaec; --muted: #9ba4ac;
  --line: #2c3237; --grid: #242a2f; --accent: #93b4ec; --housing: #0b0d0f;
  --go: #3cbd7d;   --go-ink: #6fd9a2;   --go-soft: #16291f;
  --wait: #e5b23c; --wait-ink: #f1c867; --wait-soft: #2e2511;
  --stop: #ec6a58; --stop-ink: #ff9585; --stop-soft: #351b18;
  --on-signal: #0c1210;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 28px rgb(0 0 0 / 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--font-body);
  padding-inline: 20px;
}
.page { max-width: 1120px; margin: 0 auto; padding-block: 40px 24px; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 24px;
  min-width: 0;
}
.eyebrow {
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
.section-head h2 { font-size: 22px; font-weight: 700; }
.section-head p { color: var(--muted); max-width: 62ch; }

/* ---------- Client ---------- */
.client-panel { display: grid; gap: 20px; }
.client-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.client-field { display: grid; gap: 5px; min-width: 0; }
.client-field label { font-weight: 500; }
.client-field input, .client-field select {
  width: 100%; min-width: 0; font: 15px var(--font-body); color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
}
.client-field input[aria-invalid="true"], .client-field select[aria-invalid="true"] { border-color: var(--stop); }
.client-field small { color: var(--muted); font-size: 12px; }
.client-presets { display: flex; flex-wrap: wrap; gap: 8px; }
.client-presets button {
  font: 500 13px var(--font-body); color: var(--accent); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer;
}
.client-presets button:hover { background: var(--surface-2); }
.client-results { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 20px; }
.client-decision, .client-drivers { min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--surface-2); }
.client-decision { display: grid; align-content: start; gap: 9px; }
.client-decision .label, .client-drivers h3 { font-size: 16px; font-weight: 600; }
.client-light { display: flex; align-items: center; gap: 10px; font: 700 23px var(--font-display); }
.client-light::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); }
.client-light[data-zone="green"] { color: var(--go-ink); }
.client-light[data-zone="green"]::before { background: var(--go); box-shadow: 0 0 12px var(--go); }
.client-light[data-zone="yellow"] { color: var(--wait-ink); }
.client-light[data-zone="yellow"]::before { background: var(--wait); box-shadow: 0 0 12px var(--wait); }
.client-light[data-zone="red"] { color: var(--stop-ink); }
.client-light[data-zone="red"]::before { background: var(--stop); box-shadow: 0 0 12px var(--stop); }
.client-human-note { color: var(--muted); font-size: 13px; }
.client-pd { font: 700 36px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.client-percentile, .client-small { color: var(--muted); font-size: 13px; }
.client-message { min-height: 1.4em; color: var(--muted); font-size: 13px; }
.client-message.error { color: var(--stop-ink); font-weight: 500; }
.client-note { border-left: 3px solid var(--accent); padding: 9px 12px; color: var(--muted); font-size: 13px; }
.client-drivers { display: grid; align-content: start; gap: 12px; }
.client-drivers > p { color: var(--muted); font-size: 12.5px; }
.driver-list { display: grid; gap: 10px; }
.driver-row { display: grid; gap: 5px; }
.driver-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.driver-head .num { white-space: nowrap; }
.driver-track { height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; position: relative; }
.driver-bar { height: 100%; border-radius: inherit; }
.driver-bar.risk-up { background: var(--stop); }
.driver-bar.risk-down { background: var(--go); }
.portfolio-bridge { display: grid; gap: 8px; border-left: 3px solid var(--accent); padding: 10px 14px; background: var(--surface-2); border-radius: 0 8px 8px 0; }
.portfolio-bridge strong { font-weight: 600; }
.portfolio-bridge p { color: var(--muted); font-size: 13px; }

/* ---------- En-tête ---------- */
.hero { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; }
.signal {
  width: 58px; padding: 9px 0; border-radius: 16px; background: var(--housing);
  display: grid; justify-items: center; gap: 7px;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.06), var(--shadow);
}
.lamp { width: 32px; height: 32px; border-radius: 50%; transition: opacity .3s, box-shadow .3s; }
.lamp.stop { background: var(--stop); box-shadow: 0 0 16px var(--stop); }
.lamp.wait { background: var(--wait); box-shadow: 0 0 16px var(--wait); }
.lamp.go   { background: var(--go);   box-shadow: 0 0 16px var(--go); }
.hero h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
.hero .lede { margin-top: 10px; font-size: 18px; color: var(--muted); max-width: 60ch; }
.hero .eyebrow { margin-bottom: 8px; }
.lang { align-self: start; display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button {
  font: 500 13px var(--font-body); color: var(--muted); background: transparent; border: 0;
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* ---------- Graphique principal ---------- */
.chart-panel { display: grid; gap: 18px; }
.summary { font-size: 17px; max-width: 72ch; }
.summary strong { font-weight: 600; }
.summary .g { color: var(--go-ink); } .summary .r { color: var(--stop-ink); }
.scroll { overflow-x: auto; overscroll-behavior-x: contain; margin-inline: -8px; padding-inline: 8px; }
.chart-wrap { position: relative; min-width: 720px; }
.chart-wrap svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.axis-ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding-inline: 5% 4%; }

svg text { font-family: var(--font-data); font-size: 12px; fill: var(--muted); }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .baseline { stroke: var(--line); stroke-width: 1.2; }
svg .avg { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 5; opacity: 0.75; }
svg .avg-label { fill: var(--ink); font-weight: 500; paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
svg .zone-label { font-family: var(--font-body); font-weight: 600; font-size: 12px; letter-spacing: 0.08em; }
svg .tint { transition: x .12s, width .12s; }
svg .bar { transition: fill .18s; }
svg .bar.z-green { fill: var(--go); } svg .bar.z-yellow { fill: var(--wait); } svg .bar.z-red { fill: var(--stop); }
svg .bar.hover { filter: brightness(1.15); stroke: var(--ink); stroke-width: 1.2; }
svg .handle { cursor: ew-resize; touch-action: none; }
svg .handle .hit { fill: transparent; }
svg .handle .rule { stroke-width: 2.5; }
svg .handle .flag-text { fill: var(--on-signal); font-weight: 500; font-size: 13px; }
svg .handle.green .rule, svg .handle.green .flag { stroke: var(--go); fill: var(--go); }
svg .handle.red .rule, svg .handle.red .flag { stroke: var(--stop); fill: var(--stop); }
svg .handle .flag { filter: drop-shadow(0 0 5px currentColor); }
svg .handle.green { color: var(--go); } svg .handle.red { color: var(--stop); }
svg .handle.dragging .flag { filter: drop-shadow(0 0 10px currentColor); }
svg .plot-hit { fill: transparent; cursor: pointer; }

.tooltip {
  position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); padding: 9px 12px; font-size: 13px; line-height: 1.45; white-space: nowrap;
}
.tooltip b { font-family: var(--font-display); font-size: 14px; }
.tooltip .num { font-size: 12.5px; }

.controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px 28px; align-items: end; }
.control { display: grid; gap: 6px; min-width: 0; }
.control label { font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.control label .num { font-weight: 500; }
.control.green label .num { color: var(--go-ink); } .control.red label .num { color: var(--stop-ink); }
input[type="range"] { width: 100%; margin: 0; height: 28px; cursor: pointer; }
.control.green input { accent-color: var(--go); } .control.red input { accent-color: var(--stop); }
.control .hint { font-size: 12.5px; color: var(--muted); }
button.reset {
  font: inherit; font-weight: 500; color: var(--accent); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap;
}
button.reset:hover { background: var(--surface-2); }

/* ---------- Zones ---------- */
.strip { display: flex; height: 38px; border-radius: 10px; overflow: hidden; background: var(--grid); }
.strip > div {
  display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden;
  font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--on-signal);
  transition: flex-grow .15s;
}
.strip .s-green { background: var(--go); } .strip .s-yellow { background: var(--wait); } .strip .s-red { background: var(--stop); }
.strip .s-yellow { color: #2b1d00; }

.zones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.zone {
  border-radius: 12px; padding: 18px; display: grid; gap: 12px; align-content: start;
  background: var(--surface-2); border: 1px solid var(--line);
}
.zone header { display: flex; gap: 12px; align-items: center; }
.zone .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.zone.green .dot { background: var(--go); box-shadow: 0 0 12px var(--go); }
.zone.yellow .dot { background: var(--wait); box-shadow: 0 0 12px var(--wait); }
.zone.red .dot { background: var(--stop); box-shadow: 0 0 12px var(--stop); }
.zone h3 { font-size: 18px; font-weight: 700; line-height: 1.2; }
.zone header p { font-size: 13px; color: var(--muted); }
.zone .big { font-family: var(--font-display); font-size: 38px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.zone.green .big { color: var(--go-ink); } .zone.yellow .big { color: var(--wait-ink); } .zone.red .big { color: var(--stop-ink); }
.zone .big small { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
dl.facts { margin: 0; display: grid; gap: 8px; }
dl.facts div { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; text-align: right; font-weight: 500; }
.workload { border-radius: 8px; padding: 10px 12px; background: var(--wait-soft); font-size: 13.5px; }
.workload strong { font-family: var(--font-data); font-weight: 500; }

/* ---------- Indicateurs ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.kpi { display: grid; gap: 10px; align-content: start; }
.kpi .label { font-weight: 500; }
.kpi .value { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.meter { height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .15s; }
.meter.go i { background: var(--go); } .meter.stop i { background: var(--stop); }
.compare { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
.compare .row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: center; }
.compare .meter { height: 6px; }
.compare .avg-bar i { background: var(--muted); }

/* ---------- Argent ---------- */
.money { display: grid; grid-template-columns: minmax(0, 260px) repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.lgd { display: grid; gap: 8px; align-content: start; padding-right: 8px; }
.lgd label { font-weight: 600; }
.lgd .field { display: flex; align-items: center; gap: 8px; }
.lgd input {
  width: 96px; font: 500 22px var(--font-data); color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
}
.lgd input[aria-invalid="true"] { border-color: var(--stop); }
.lgd .field span { font: 500 20px var(--font-data); color: var(--muted); }
.lgd p { font-size: 13px; color: var(--muted); }
.lgd .error { color: var(--stop-ink); font-weight: 500; }
.amount { border-radius: 12px; padding: 16px 18px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.amount .label { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.amount .label .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.amount .value { font-family: var(--font-data); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.15; word-break: keep-all; overflow-wrap: anywhere; }
.amount .sub { font-size: 13px; color: var(--muted); }

/* ---------- Courbe d'arbitrage ---------- */
.tradeoff { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.tradeoff .scroll .chart-wrap { min-width: 520px; }
.tradeoff aside { display: grid; gap: 12px; color: var(--muted); }
.tradeoff aside strong { color: var(--ink); font-weight: 600; }
svg .curve { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
svg .curve-area { fill: var(--accent); opacity: 0.08; }
svg .curve-dot { fill: var(--go); stroke: var(--surface); stroke-width: 3; filter: drop-shadow(0 0 6px var(--go)); }
svg .curve-guide { stroke: var(--go); stroke-width: 1; stroke-dasharray: 3 4; }
svg .curve-label { fill: var(--ink); font-weight: 500; paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
svg .axis-title { font-family: var(--font-body); font-size: 13px; fill: var(--muted); }
svg .empty-msg { font-family: var(--font-body); font-size: 15px; fill: var(--muted); }

/* ---------- Notes ---------- */
.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.notes h3 { font-size: 16px; margin-bottom: 8px; }
.notes p, .notes li { color: var(--muted); font-size: 14px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

footer { text-align: center; color: var(--muted); font-size: 13px; padding-block: 8px 24px; }

/* ---------- Petits écrans ---------- */
@media (max-width: 960px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .money { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lgd { grid-column: 1 / -1; }
  .tradeoff { grid-template-columns: 1fr; }
  .client-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  body { padding-inline: 16px; }
  .page { padding-block: 24px 16px; gap: 20px; }
  .panel { padding: 18px 16px; }
  .hero { grid-template-columns: 1fr; gap: 14px; }
  .lang { justify-self: start; grid-row: 1; }
  .signal { grid-auto-flow: column; width: auto; justify-self: start; padding: 7px 9px; gap: 7px; }
  .lamp { width: 22px; height: 22px; }
  .controls { grid-template-columns: 1fr; }
  .zones, .money, .notes { grid-template-columns: 1fr; }
  .client-fields, .client-results { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 440px) {
  .kpis { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<main class="page">

  <header class="hero">
    <div class="signal" aria-hidden="true">
      <span class="lamp stop"></span><span class="lamp wait"></span><span class="lamp go"></span>
    </div>
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p class="lede" data-i18n="lede"></p>
    </div>
    <nav class="lang" id="lang" data-i18n-aria="langAria">
      <button type="button" data-lang="fr" lang="fr-CA">FR</button>
      <button type="button" data-lang="en" lang="en-CA">EN</button>
      <button type="button" data-lang="zh" lang="zh-CN">中文</button>
      <button type="button" data-lang="es" lang="es">ES</button>
      <button type="button" data-lang="ja" lang="ja-JP">日本語</button>
    </nav>
  </header>

  <section class="panel client-panel" aria-labelledby="t-client">
    <div class="section-head">
      <h2 id="t-client" data-client-text="title"></h2>
      <p data-client-text="hint"></p>
    </div>
    <div class="client-presets" data-client-aria="presetAria">
      <button type="button" data-profile="prudent" data-client-text="profilePrudent"></button>
      <button type="button" data-profile="moyen" data-client-text="profileMedium"></button>
      <button type="button" data-profile="risque" data-client-text="profileRisk"></button>
    </div>
    <div class="client-fields" id="client-fields"></div>
    <p class="client-message" id="client-message" role="status" aria-live="polite"></p>
    <div class="client-results">
      <article class="client-decision" aria-live="polite">
        <span class="label" data-client-text="decisionLabel"></span>
        <div class="client-light" id="client-light" data-zone=""></div>
        <span class="client-pd" id="client-pd">—</span>
        <span class="client-percentile" id="client-percentile">—</span>
        <span class="client-human-note" id="client-human-note" data-client-text="humanNote" hidden></span>
      </article>
      <article class="client-drivers">
        <h3 data-client-text="driversTitle"></h3>

    g = Math.max(0, Math.min(K, Math.round(g)));
    r = Math.max(0, Math.min(K, Math.round(r)));
    // On garde toujours 0 ≤ g ≤ r ≤ 100 : la ligne déplacée pousse jusqu'à l'autre, sans la dépasser.
    if (source === "g") g = Math.min(g, r);
    else if (source === "r") r = Math.max(r, g);
    else if (g > r) g = r;
    if (g === state.g && r === state.r && source !== "init") return;
    state.g = g; state.r = r;
    render();
  }

  // ---------- Client individuel ----------
  const CLIENT_STEPS = {
    loan_amnt: "any", emp_length: "1", annual_inc: "any", dti: "any",
    open_acc: "1", pub_rec: "1", revol_bal: "any", revol_util: "any",
    total_acc: "1", mort_acc: "1", pub_rec_bankruptcies: "1",
    credit_hist_years: "any",
  };
  let clientNumber = new Intl.NumberFormat("fr-CA", { maximumFractionDigits: 2 });
  let clientPercent = new Intl.NumberFormat("fr-CA", { maximumFractionDigits: 1 });

  function clientValue(value) {
    return clientNumber.format(value);
  }
  function clientMoney(value) {
    return T.usd(clientNumber.format(value));
  }
  function categoryMode(name) {
    const levels = MODEL.categories[name];
    let bestLevel = levels[0], bestShare = -1;
    for (const level of levels) {
      const index = MODEL.features.indexOf(name + "_" + level);
      const share = index < 0
        ? 1 - levels.reduce((total, item) => {
          const i = MODEL.features.indexOf(name + "_" + item);
          return total + (i < 0 ? 0 : MODEL.mean[i]);
        }, 0)
        : MODEL.mean[index];
      if (share > bestShare) { bestLevel = level; bestShare = share; }
    }
    return bestLevel;
  }
  function buildClientInputs() {
    const fields = $("client-fields");
    for (const name of MODEL.numeric_inputs) {
      if (name === "loan_to_income") continue;
      const range = MODEL.ranges[name];
      const wrapper = document.createElement("div");
      wrapper.className = "client-field";
      const label = document.createElement("label");
      label.dataset.variableLabel = name;
      const input = document.createElement("input");
      const hint = document.createElement("small");
      hint.dataset.variableRange = name;
      input.id = "client-" + name;
      input.type = "number";
      input.inputMode = "decimal";
      input.min = range.p1;
      input.max = range.p99;
      input.step = CLIENT_STEPS[name] || "any";
      input.value = range.median;
      input.dataset.variable = name;
      label.htmlFor = input.id;
      wrapper.append(label, input, hint);
      fields.appendChild(wrapper);
      input.addEventListener("input", () => renderClient(false));
      input.addEventListener("change", () => renderClient(true));
    }
    for (const [name, levels] of Object.entries(MODEL.categories)) {
      const wrapper = document.createElement("div");
      wrapper.className = "client-field";
      const label = document.createElement("label");
      label.dataset.variableLabel = name;
      const select = document.createElement("select");
      select.id = "client-" + name;
      select.dataset.variable = name;
      label.htmlFor = select.id;
      for (const level of levels) {
        const option = document.createElement("option");
        option.value = level;
        option.textContent = (CT.categories[name] && CT.categories[name][level]) || level;
        select.appendChild(option);
      }
      select.value = categoryMode(name);
      wrapper.append(label, select);
      fields.appendChild(wrapper);
      select.addEventListener("change", () => renderClient(false));
    }
    updateClientInputText();
  }

  function updateClientInputText() {
    for (const label of document.querySelectorAll("[data-variable-label]")) {
      const name = label.dataset.variableLabel;
      label.textContent = CT.labels[name] || name;
    }
    for (const hint of document.querySelectorAll("[data-variable-range]")) {
      const range = MODEL.ranges[hint.dataset.variableRange];
      hint.textContent = CT.range(clientValue(range.p1), clientValue(range.p99), clientValue(range.median));
    }
    for (const select of document.querySelectorAll("#client-fields select")) {
      for (const option of select.options) {
        option.textContent = (CT.categories[select.dataset.variable] || {})[option.value] || option.value;
      }
    }
  }

  function percentilePosition(value) {
    const cuts = MODEL.pd_cuts;
    let lo = 0, hi = cuts.length;
    while (lo < hi) {
      const mid = (lo + hi) >>> 1;
      if (cuts[mid] <= value) lo = mid + 1;
      else hi = mid;
    }
    if (lo === 0) return 0;
    if (lo === cuts.length) return 100;
    const lower = lo - 1, span = cuts[lo] - cuts[lower];
    const fraction = span > 0 ? (value - cuts[lower]) / span : 0;
    return lower + fraction;
  }

  function driverLabel(name, values) {
    const base = CT.drivers[name] || name;
    if (!MODEL.categories[name]) return base;
    const level = (CT.categories[name] && CT.categories[name][values[name]]) || values[name];
    return base + " · " + level;
  }

  function renderDrivers(result) {
    const list = $("driver-list");
    list.replaceChildren();
    const drivers = Object.entries(result.contributions)
      .filter(([, amount]) => amount !== 0)
      .map(([name, amount]) => ({ name, amount }))
      .sort((a, b) => b.amount - a.amount);
    const selected = drivers.filter((item) => item.amount > 0).slice(0, 3)
      .concat(drivers.filter((item) => item.amount < 0).slice(-2).reverse());
    if (!selected.length) {
      list.textContent = CT.noDrivers;
      return;
    }
    const max = Math.max(...selected.map((item) => Math.abs(item.amount)));
    for (const item of selected) {
      const row = document.createElement("div");
      row.className = "driver-row";
      const head = document.createElement("div");
      head.className = "driver-head";
      const label = document.createElement("span");
      label.textContent = driverLabel(item.name, result.input);
      const amount = document.createElement("span");
      amount.className = "num";
      amount.textContent = (item.amount > 0 ? "+" : "") + item.amount.toFixed(3);
      head.append(label, amount);
      const track = document.createElement("div");
      track.className = "driver-track";
      track.setAttribute("aria-hidden", "true");
      const bar = document.createElement("div");
      bar.className = "driver-bar " + (item.amount > 0 ? "risk-up" : "risk-down");
      bar.style.width = (Math.abs(item.amount) / max * 100) + "%";
      if (item.amount < 0) bar.style.marginLeft = "auto";
      track.appendChild(bar);
      row.append(head, track);
      list.appendChild(row);
    }
  }

  function renderClient(applyClamps) {
    const input = {};
    let invalid = null;
    for (const name of MODEL.numeric_inputs) {
      if (name === "loan_to_income") continue;
      const field = $("client-" + name);
      field.setAttribute("aria-invalid", "false");
      if (field.value.trim() === "" || !Number.isFinite(Number(field.value))) {
        field.setAttribute("aria-invalid", "true");
        invalid = field;
        break;
      }
      input[name] = Number(field.value);
    }
    if (invalid) {
      $("client-message").textContent = CT.invalidNumeric;
      $("client-message").classList.add("error");
      $("client-light").textContent = CT.incomplete;
      $("client-light").dataset.zone = "";
      $("client-human-note").hidden = true;
      setText("client-pd", "—");
      setText("client-percentile", "—");
      setText("client-expected-loss", "—");
      $("driver-list").replaceChildren();
      return;
    }
    for (const name of Object.keys(MODEL.categories)) input[name] = $("client-" + name).value;
    const result = calculateClient(MODEL, input);
    const clamped = Object.entries(result.clamped);
    if (applyClamps) {
      for (const [name, value] of clamped) $("client-" + name).value = value.to;
    }
    const message = $("client-message");
    message.classList.toggle("error", clamped.length > 0);
    message.textContent = clamped.length
      ? CT.clamped(clamped.map(([name, value]) =>
        (CT.labels[name] || name) + " (" + clientValue(value.to) + ")").join(", "))
      : "";

    const greenCut = MODEL.pd_cuts[state.g], redCut = MODEL.pd_cuts[state.r];
    const zone = result.pd < greenCut ? "green" : result.pd >= redCut ? "red" : "yellow";
    $("client-light").textContent = CT.zones[zone];
    $("client-light").dataset.zone = zone;
    $("client-human-note").hidden = zone !== "red";
    setText("client-pd", clientPercent.format(result.pd * 100) + " %");
    const percentile = percentilePosition(result.pd);
    setText("client-percentile", CT.percentile(clientPercent.format(percentile)));
    const lgdText = clientPercent.format(state.lgd * 100) + " %";
    const eadText = clientMoney(result.input.loan_amnt);
    setText("client-expected-loss", clientPercent.format(result.pd * 100) + " % × "
      + lgdText + " × " + eadText + " = "
      + clientMoney(result.pd * state.lgd * result.input.loan_amnt));
    renderDrivers(result);
  }

  document.querySelectorAll("[data-profile]").forEach((button) => {
    button.addEventListener("click", () => {
      let profile;
      if (button.dataset.profile === "moyen") {
        profile = Object.fromEntries(MODEL.numeric_inputs.filter((name) => name !== "loan_to_income")
          .map((name) => [name, MODEL.ranges[name].median]));
        for (const name of Object.keys(MODEL.categories)) profile[name] = categoryMode(name);
      } else {
        const checkIndex = button.dataset.profile === "prudent" ? 1 : 0;
        profile = MODEL.check[checkIndex].input;
      }
      for (const name of MODEL.numeric_inputs) {
        if (name !== "loan_to_income") $("client-" + name).value = profile[name];
      }
      for (const name of Object.keys(MODEL.categories)) $("client-" + name).value = profile[name];
      renderClient(true);
    });
  });

  // ---------- Outils SVG ----------
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    const node = document.createElementNS(NS, tag);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }
  function svgPoint(svg, evt) {
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  // ---------- Graphique principal ----------
  const main = document.getElementById("main-chart");
  const W = 1000, H = 400, M = { l: 52, r: 44, t: 50, b: 34 };
  const PW = W - M.l - M.r, PH = H - M.t - M.b, BAND = PW / K;
  const Y_MAX = 0.3;
  const x = (i) => M.l + i * BAND;
  const y = (v) => M.t + PH * (1 - v / Y_MAX);

  let tints, zoneLabels, bars, handles;
  // Construit (ou reconstruit, au changement de langue) tout le graphique.
  function buildMain() {
    main.replaceChildren();
    tints = {}; zoneLabels = {}; bars = []; handles = {};
    el("desc", { id: "main-desc" }, main).textContent = T.mainDesc;
    for (const z of ["green", "yellow", "red"]) {
      const soft = { green: "var(--go-soft)", yellow: "var(--wait-soft)", red: "var(--stop-soft)" }[z];
      tints[z] = el("rect", { class: "tint", y: M.t, height: PH, fill: soft }, main);
    }
    for (let v = 0; v <= Y_MAX + 1e-9; v += 0.05) {
      el("line", { class: v === 0 ? "baseline" : "gridline", x1: M.l, x2: W - M.r, y1: y(v), y2: y(v) }, main);
      el("text", { x: M.l - 8, y: y(v) + 4, "text-anchor": "end" }, main).textContent = fmt.pct0(v);
    }
    for (let i = 0; i <= K; i += 10) {
      el("text", { x: x(i), y: H - M.b + 20, "text-anchor": "middle" }, main).textContent = i;
    }
    for (let i = 0; i < K; i++) {
      const v = rate(d[i], n[i]);
      const gap = BAND * 0.14;
      bars.push(el("rect", { class: "bar", x: x(i) + gap / 2, width: BAND - gap, y: y(v), height: y(0) - y(v), rx: 1.5 }, main));
    }
    el("line", { class: "avg", x1: M.l, x2: W - M.r, y1: y(AVG), y2: y(AVG) }, main);
    el("text", { class: "avg-label", x: M.l + 8, y: y(AVG) - 8 }, main).textContent = T.avg(fmt.pct(AVG));

    const colors = ["var(--go-ink)", "var(--wait-ink)", "var(--stop-ink)"];
    ["green", "yellow", "red"].forEach((z, k) => {
      zoneLabels[z] = el("text", { class: "zone-label", y: M.t + 18, "text-anchor": "middle", fill: colors[k] }, main);
      zoneLabels[z].textContent = T.zoneLabels[k];
    });

    // Zone cliquable : un clic déplace la ligne la plus proche.
    el("rect", { class: "plot-hit", x: M.l, y: M.t, width: PW, height: PH }, main);

    // Poignées : le drapeau vert pointe vers la gauche (zone verte), le rouge vers la droite.
    for (const key of ["g", "r"]) {
      const cls = key === "g" ? "green" : "red";
      const grp = el("g", { class: "handle " + cls, "data-handle": key, "aria-hidden": "true" }, main);
      const hit = el("rect", { class: "hit", y: M.t - 36, width: 40, height: PH + 36 }, grp);
      const rule = el("line", { class: "rule", y1: M.t - 32, y2: M.t + PH }, grp);
      const flag = el("rect", { class: "flag", y: M.t - 36, width: 40, height: 24, rx: 6 }, grp);
      const text = el("text", { class: "flag-text", y: M.t - 19.5, "text-anchor": "middle" }, grp);
      handles[key] = { grp, hit, rule, flag, text };
    }
  }

  function renderMain() {
    const { g, r } = state;
    const spans = { green: [0, g], yellow: [g, r], red: [r, K] };
    for (const z in spans) {
      const [a, b] = spans[z];
      const w = x(b) - x(a);
      tints[z].setAttribute("x", x(a));
      tints[z].setAttribute("width", Math.max(0, w));
      zoneLabels[z].setAttribute("x", (x(a) + x(b)) / 2);
      zoneLabels[z].style.display = w >= 60 ? "" : "none";
    }
    for (let i = 0; i < K; i++) {
      bars[i].setAttribute("class", "bar " + (i < g ? "z-green" : i < r ? "z-yellow" : "z-red") + (i === hoverIndex ? " hover" : ""));
    }
    for (const key of ["g", "r"]) {
      const h = handles[key], xv = x(state[key]);
      const fx = key === "g" ? xv - 40 : xv;
      h.rule.setAttribute("x1", xv); h.rule.setAttribute("x2", xv);
      h.flag.setAttribute("x", fx);
      h.hit.setAttribute("x", key === "g" ? xv - 30 : xv - 10);
      h.text.setAttribute("x", fx + 20);
      h.text.textContent = state[key];
    }
  }

  // Glisser les lignes (souris, doigt ou stylet).
  let dragging = null, justDragged = false, hoverIndex = -1;
  const tooltip = document.getElementById("tooltip");
  const wrap = document.getElementById("main-wrap");
  const valueAt = (evt) => Math.round((svgPoint(main, evt).x - M.l) / BAND);

  main.addEventListener("pointerdown", (evt) => {
    const h = evt.target.closest("[data-handle]");
    if (!h) return;
    dragging = h.dataset.handle;
    handles[dragging].grp.classList.add("dragging");
    main.setPointerCapture(evt.pointerId);
    evt.preventDefault();
    hideTooltip();
  });
  main.addEventListener("pointermove", (evt) => {
    if (dragging) {
      const v = valueAt(evt);
      if (dragging === "g") setThresholds(v, state.r, "g");
      else setThresholds(state.g, v, "r");
      justDragged = true;
      return;
    }
    if (evt.pointerType === "mouse") showTooltip(evt);
  });
  function endDrag() {
    if (!dragging) return;
    handles[dragging].grp.classList.remove("dragging");
    dragging = null;
    setTimeout(() => { justDragged = false; }, 0);
  }
  main.addEventListener("pointerup", endDrag);
  main.addEventListener("pointercancel", endDrag);
  main.addEventListener("pointerleave", () => { if (!dragging) hideTooltip(); });
  main.addEventListener("click", (evt) => {
    if (justDragged || evt.target.closest("[data-handle]")) return;
    const v = Math.max(0, Math.min(K, valueAt(evt)));
    // Déplace la ligne la plus proche ; entre les deux, celle du côté cliqué.
    const useG = Math.abs(v - state.g) < Math.abs(v - state.r) || (state.g === state.r && v < state.g);
    if (useG) setThresholds(v, state.r, "g"); else setThresholds(state.g, v, "r");
  });

  function showTooltip(evt) {
    const p = svgPoint(main, evt);
    const i = Math.floor((p.x - M.l) / BAND);
    if (i < 0 || i >= K || p.y < M.t || p.y > M.t + PH) { hideTooltip(); return; }
    if (i !== hoverIndex) {
      if (hoverIndex >= 0) bars[hoverIndex].classList.remove("hover");
      hoverIndex = i;
      bars[i].classList.add("hover");
      const zoneName = T.zoneNames[i < state.g ? 0 : i < state.r ? 1 : 2];
      tooltip.innerHTML = T.tooltip(i, zoneName, fmt.int(n[i]), fmt.int(d[i]), fmt.pct(rate(d[i], n[i])), fmt.pct(pd[i]));
    }
    tooltip.hidden = false;
    const box = wrap.getBoundingClientRect();
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let left = evt.clientX - box.left + 14;
    if (left + tw > box.width) left = evt.clientX - box.left - tw - 14;
    const top = Math.max(0, evt.clientY - box.top - th - 12);
    tooltip.style.transform = "translate(" + left + "px," + top + "px)";
  }
  function hideTooltip() {
    tooltip.hidden = true;
    if (hoverIndex >= 0 && bars[hoverIndex]) bars[hoverIndex].classList.remove("hover");
    hoverIndex = -1;
  }

  // ---------- Curseurs ----------
  const gRange = document.getElementById("g-range"), rRange = document.getElementById("r-range");
  gRange.addEventListener("input", () => setThresholds(+gRange.value, state.r, "g"));
  rRange.addEventListener("input", () => setThresholds(state.g, +rRange.value, "r"));
  document.getElementById("reset").addEventListener("click", () => setThresholds(DEFAULT.g, DEFAULT.r, "reset"));

  // ---------- LGD ----------
  const lgdInput = document.getElementById("lgd"), lgdHelp = document.getElementById("lgd-help");
  function checkLgd() {
    const v = parseFloat(lgdInput.value.replace(",", "."));
    const ok = Number.isFinite(v) && v >= 0 && v <= 100;
    lgdInput.setAttribute("aria-invalid", ok ? "false" : "true");
    lgdHelp.textContent = ok ? T.lgdHelp : T.lgdError(fmt.pct0(state.lgd));
    lgdHelp.classList.toggle("error", !ok);
    return ok ? v / 100 : null;
  }
  lgdInput.addEventListener("input", () => {
    const v = checkLgd();
    if (v !== null) {
      state.lgd = v;
      renderMoney(metrics(state.g, state.r));
      renderClient(false);
    }
  });

  // ---------- Courbe d'arbitrage ----------
  const trade = document.getElementById("trade-chart");
  const TW = 760, TH = 400, TM = { l: 62, r: 26, t: 24, b: 58 };
  const TPW = TW - TM.l - TM.r, TPH = TH - TM.t - TM.b;
  const TX_MAX = 1, TY_MAX = 0.14;
  const tx = (v) => TM.l + TPW * (v / TX_MAX);
  const ty = (v) => TM.t + TPH * (1 - v / TY_MAX);
  let tradeLayer, tradePoints = [];

  function buildTrade() {
    trade.replaceChildren();
    el("desc", { id: "trade-desc" }, trade).textContent = T.tradeDesc;
    for (let v = 0; v <= TY_MAX + 1e-9; v += 0.02) {
      el("line", { class: v === 0 ? "baseline" : "gridline", x1: TM.l, x2: TW - TM.r, y1: ty(v), y2: ty(v) }, trade);
      el("text", { x: TM.l - 8, y: ty(v) + 4, "text-anchor": "end" }, trade).textContent = fmt.pct0(v);
    }
    for (let v = 0; v <= 1 + 1e-9; v += 0.2) {
      el("line", { class: "gridline", x1: tx(v), x2: tx(v), y1: TM.t, y2: TM.t + TPH }, trade);
      el("text", { x: tx(v), y: TM.t + TPH + 20, "text-anchor": "middle" }, trade).textContent = fmt.pct0(v);
    }
    el("text", { class: "axis-title", x: TM.l + TPW / 2, y: TH - 10, "text-anchor": "middle" }, trade).textContent = T.axisX;
    el("text", { class: "axis-title", transform: "translate(16 " + (TM.t + TPH / 2) + ") rotate(-90)", "text-anchor": "middle" }, trade).textContent = T.axisY;
    el("line", { class: "avg", x1: TM.l, x2: TW - TM.r, y1: ty(AVG), y2: ty(AVG) }, trade);
    el("text", { class: "avg-label", x: TM.l + 8, y: ty(AVG) - 8 }, trade).textContent = T.avg(fmt.pct(AVG));
    tradeLayer = el("g", {}, trade);
    el("rect", { class: "plot-hit", x: TM.l, y: TM.t, width: TPW, height: TPH }, trade);
  }

  function renderTrade() {
    const { g, r } = state;
    tradeLayer.replaceChildren();
    tradePoints = [];
    for (let gi = 1; gi <= K; gi++) {
      const mm = metrics(gi, K);
      tradePoints.push({ g: gi, x: mm.green.n / N, y: mm.greenRate });
    }
    const text = document.getElementById("trade-text");
    if (!tradePoints.length) {
      el("text", { class: "empty-msg", x: TM.l + TPW / 2, y: TM.t + TPH / 2, "text-anchor": "middle" }, tradeLayer).textContent = T.emptyCurve;
      text.innerHTML = T.tradeNoGreen();
      return;
    }
    const pts = tradePoints.map((p) => tx(p.x).toFixed(1) + "," + ty(p.y).toFixed(1));
    const first = tradePoints[0], last = tradePoints[tradePoints.length - 1];
    el("path", { class: "curve-area", d: "M" + tx(first.x) + "," + ty(0) + " L" + pts.join(" L") + " L" + tx(last.x) + "," + ty(0) + " Z" }, tradeLayer);
    el("path", { class: "curve", d: "M" + pts.join(" L") }, tradeLayer);

    const cur = tradePoints.find((p) => p.g === g);
    if (cur) {
      const cx = tx(cur.x), cy = ty(cur.y);
      el("line", { class: "curve-guide", x1: cx, x2: cx, y1: cy, y2: TM.t + TPH }, tradeLayer);
      el("line", { class: "curve-guide", x1: TM.l, x2: cx, y1: cy, y2: cy }, tradeLayer);
      el("circle", { class: "curve-dot", cx, cy, r: 8 }, tradeLayer);
      const right = cx > TW - 220;
      el("text", { class: "curve-label", x: right ? cx - 14 : cx + 14, y: cy - 14, "text-anchor": right ? "end" : "start" }, tradeLayer)
        .textContent = T.curveLabel(g, fmt.pct(cur.x), fmt.pct(cur.y));
      text.innerHTML = T.tradeText(g, fmt.pct(cur.x), fmt.pct(cur.y));
    } else {
      text.innerHTML = T.tradeNoGreen();
    }
  }
  trade.addEventListener("click", (evt) => {
    if (!tradePoints.length) return;
    const px = svgPoint(trade, evt).x;
    let best = tradePoints[0];
    for (const p of tradePoints) if (Math.abs(tx(p.x) - px) < Math.abs(tx(best.x) - px)) best = p;
    setThresholds(best.g, Math.max(state.r, best.g), "reset");
  });

  // ---------- Rendu du texte ----------
  const $ = (id) => document.getElementById(id);
  const setText = (id, t) => { $(id).textContent = t; };
  const setWidth = (id, v) => { $(id).style.width = (Number.isFinite(v) ? Math.max(0, Math.min(1, v)) * 100 : 0) + "%"; };

  function renderMoney(mm) {
    const L = state.lgd, lgdText = fmt.pct0(L);
    setText("m-loss", fmt.usd(mm.green.md * L));
    setText("m-loss-sub", T.lossSub(fmt.usd(mm.green.md), lgdText));
    setText("m-avoided", fmt.usd(mm.red.md * L));
    setText("m-avoided-sub", T.avoidedSub(fmt.usd(mm.red.md), lgdText));
    setText("m-good-reviewed", fmt.usd(mm.red.m - mm.red.md));
  }

  function render() {
    const { g, r } = state;
    const mm = metrics(g, r);

    gRange.value = g; rRange.value = r;
    setText("g-out", T.percentile(g));
    setText("r-out", T.percentile(r));
    gRange.setAttribute("aria-valuetext", T.percentile(g));
    rRange.setAttribute("aria-valuetext", T.percentile(r));

    $("summary").innerHTML = T.summary(g, r, fmt.pct(mm.auto), fmt.pct(mm.greenRate), fmt.pct(AVG));

    // Bande tricolore
    const segs = $("strip").children, shares = [mm.green.n / N, mm.yellow.n / N, mm.red.n / N];
    for (let k = 0; k < 3; k++) {
      segs[k].style.flex = shares[k] + " 1 0";
      segs[k].textContent = shares[k] >= 0.1 ? T.stripNames[k] + " " + fmt.pct(shares[k]) : shares[k] >= 0.05 ? fmt.pct0(shares[k]) : "";
    }

    // Cartes des zones
    for (const z of ["green", "yellow", "red"]) {
      const zz = mm[z];
      $("z-" + z + "-share").innerHTML = fmt.pct(zz.n / N) + "<small>" + T.ofApps + "</small>";
      setText("z-" + z + "-n", fmt.int(zz.n));
      setText("z-" + z + "-dr", fmt.pct(rate(zz.d, zz.n)));
    }
    setText("z-green-rule", ruleGreen(g));
    setText("z-yellow-rule", ruleYellow(g, r));
    setText("z-red-rule", ruleRed(r));
    $("workload").innerHTML = mm.yellow.n ? T.workload(fmt.int(mm.yellow.n), fmt.int(Math.round(mm.yellow.n / 12))) : T.workloadNone;

    // Indicateurs
    setText("k-auto", fmt.pct(mm.auto)); setWidth("k-auto-m", mm.auto);
    setText("k-analysts", fmt.pct(mm.analystLoad)); setWidth("k-analysts-m", mm.analystLoad);
    setText("k-green", fmt.pct(mm.greenRate));
    const scale = Math.max(AVG, Number.isFinite(mm.greenRate) ? mm.greenRate : 0);
    setWidth("k-green-m", mm.greenRate / scale); setWidth("k-avg-m", AVG / scale);
    if (!Number.isFinite(mm.greenRate)) setText("k-green-sub", T.greenEmpty);
    else {
      const rel = mm.greenRate / AVG - 1;
      setText("k-green-sub", Math.abs(rel) < 0.005 ? T.greenEqual(fmt.pct(AVG))
        : (rel < 0 ? T.greenLess : T.greenMore)(fmt.pct0(Math.abs(rel)), fmt.pct(AVG)));
    }
    setText("k-caught", fmt.pct(mm.caught)); setWidth("k-caught-m", mm.caught);
    setText("k-caught-sub", T.caughtSub(fmt.int(mm.red.d), fmt.int(D)));
    setText("k-good", fmt.pct(mm.goodReviewed)); setWidth("k-good-m", mm.goodReviewed);
    setText("k-good-sub", T.goodSub(fmt.int(mm.red.n - mm.red.d), fmt.int(N - D)));

    renderMoney(mm);
    renderMain();
    renderTrade();
    renderClient(false);
  }

  // ---------- Changement de langue ----------
  function setLang(lang) {
    T = I18N[lang] || I18N.fr;
    CT = CLIENT_TEXT[lang] || CLIENT_TEXT.fr;
    fmt = makeFormats(T.locale);
    clientNumber = new Intl.NumberFormat(T.locale, { maximumFractionDigits: 2 });
    clientPercent = new Intl.NumberFormat(T.locale, { maximumFractionDigits: 1 });
    hideTooltip();
    applyStaticText();
    updateClientInputText();
    checkLgd();
    setText("note-data", T.noteData(fmt.int(N), fmt.pct(AVG)));
    buildMain();
    buildTrade();
    render();
  }
  document.getElementById("lang").addEventListener("click", (evt) => {
    const b = evt.target.closest("button[data-lang]");
    if (!b) return;
    history.replaceState(null, "", b.dataset.lang === "fr" ? location.pathname : "#" + b.dataset.lang);
    setLang(b.dataset.lang);
  });
  window.addEventListener("hashchange", () => setLang(langFromHash()));

  buildClientInputs();
  setLang(langFromHash());
})();
</script>
</body>
</html>
